[package]
name = "kom"
version = "1.0.2"
edition = "2024"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive", "env"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
influxdb2 = "0.5.2"
influxdb2-structmap = "0.2.0"
num-traits = "0.2.19"
sunrise = "3.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full"] }
tower-http = { version = "0.6.10", features = ["fs"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "serde"] }